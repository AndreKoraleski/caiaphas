[package]
name = "caiaphas-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = """
Command that checks ISO/IEC 14977 EBNF grammars for caiaphas and explains \
each finding"""
license.workspace = true
repository.workspace = true
keywords = ["ebnf", "grammar", "parser-generator", "iso-14977", "cli"]
categories = ["command-line-utilities", "parsing"]
# The command has no library, so its docs are the findings it explains.
documentation = "https://docs.rs/caiaphas-generator/latest/caiaphas_generator/findings/"

[[bin]]
name = "caiaphas"
path = "src/main.rs"
# Its docs would take the place of those of the caiaphas library.
doc = false

[dependencies]
caiaphas-generator.workspace = true

[lints]
workspace = true
